<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="820" viewBox="0 0 1110 820">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
</marker>
<marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
</marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="#fbfbf7"/>
<text x="40" y="38" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#111827">Combined vs Separated Physics</text>
<text x="40" y="62" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#475569">Combined starts with a free choice of updater functions; separated walks the checks in a fixed order first.</text>
<rect x="30.00" y="92.00" width="500.00" height="620.00" rx="18.00" ry="18.00" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.20" opacity="1.000"/>
<text x="48.00" y="120.00" text-anchor="start" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">Combined</text>
<text x="48.00" y="142.00" text-anchor="start" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">Any updater can be chosen as soon as the tick starts.</text>
<rect x="560.00" y="92.00" width="500.00" height="620.00" rx="18.00" ry="18.00" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.20" opacity="1.000"/>
<text x="578.00" y="120.00" text-anchor="start" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">Separated</text>
<text x="578.00" y="142.00" text-anchor="start" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">The available updater narrows as the tick advances.</text>
<rect x="90.00" y="176.00" width="380.00" height="46.00" rx="16.00" ry="16.00" fill="#dbeafe" stroke="#2563eb" stroke-width="1.60" opacity="1.000"/>
<text x="280.00" y="202.00" text-anchor="middle" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">start_tick</text>
<text x="280.00" y="215.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">opens the tick</text>
<line x1="280.00" y1="222.00" x2="280.00" y2="234.00" stroke="#2563eb" stroke-width="2.20" marker-end="url(#arrow)" opacity="1.000"/>
<rect x="70.00" y="234.00" width="420.00" height="90.00" rx="16.00" ry="16.00" fill="#fff7ed" stroke="#d97706" stroke-width="1.60" opacity="1.000"/>
<text x="280.00" y="258.00" text-anchor="middle" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#9a3412">choose any updater</text>
<text x="280.00" y="274.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#7c2d12">fall, roll left, roll right, or noop</text>
<rect x="88.00" y="290.00" width="88.50" height="26.00" rx="9.00" ry="9.00" fill="#fed7aa" stroke="#ea580c" stroke-width="1.10" opacity="1.000"/>
<text x="132.25" y="307.00" text-anchor="middle" font-size="8" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#9a3412">fall</text>
<rect x="186.50" y="290.00" width="88.50" height="26.00" rx="9.00" ry="9.00" fill="#fed7aa" stroke="#ea580c" stroke-width="1.10" opacity="1.000"/>
<text x="230.75" y="307.00" text-anchor="middle" font-size="8" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#9a3412">roll left</text>
<rect x="285.00" y="290.00" width="88.50" height="26.00" rx="9.00" ry="9.00" fill="#fed7aa" stroke="#ea580c" stroke-width="1.10" opacity="1.000"/>
<text x="329.25" y="307.00" text-anchor="middle" font-size="8" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#9a3412">roll right</text>
<rect x="383.50" y="290.00" width="88.50" height="26.00" rx="9.00" ry="9.00" fill="#fed7aa" stroke="#ea580c" stroke-width="1.10" opacity="1.000"/>
<text x="427.75" y="307.00" text-anchor="middle" font-size="8" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#9a3412">noop</text>
<rect x="90.00" y="336.00" width="380.00" height="46.00" rx="16.00" ry="16.00" fill="#e2e8f0" stroke="#475569" stroke-width="1.60" opacity="1.000"/>
<text x="280.00" y="362.00" text-anchor="middle" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">end_tick</text>
<text x="280.00" y="375.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">tick closes after one choice resolves</text>
<rect x="620.00" y="176.00" width="380.00" height="46.00" rx="16.00" ry="16.00" fill="#dbeafe" stroke="#2563eb" stroke-width="1.60" opacity="1.000"/>
<text x="810.00" y="202.00" text-anchor="middle" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">start_tick</text>
<text x="810.00" y="215.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">opens the tick</text>
<line x1="810.00" y1="222.00" x2="810.00" y2="234.00" stroke="#2563eb" stroke-width="2.20" marker-end="url(#arrow)" opacity="1.000"/>
<rect x="604.00" y="234.00" width="132.00" height="46.00" rx="16.00" ry="16.00" fill="#fff7ed" stroke="#d97706" stroke-width="1.60" opacity="1.000"/>
<text x="670.00" y="260.00" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">fall</text>
<text x="670.00" y="273.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">take the fall branch</text>
<rect x="746.00" y="234.00" width="252.00" height="46.00" rx="16.00" ry="16.00" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.60" opacity="1.000"/>
<text x="872.00" y="260.00" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">can fall</text>
<text x="872.00" y="273.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">if possible, open the fall branch</text>
<line x1="746.00" y1="257.00" x2="736.00" y2="257.00" stroke="#7c3aed" stroke-width="2.00" marker-end="url(#arrow)" opacity="1.000"/>
<line x1="872.00" y1="280.00" x2="872.00" y2="292.00" stroke="#7c3aed" stroke-width="2.20" marker-end="url(#arrow)" opacity="1.000"/>
<rect x="604.00" y="292.00" width="132.00" height="46.00" rx="16.00" ry="16.00" fill="#fff7ed" stroke="#d97706" stroke-width="1.60" opacity="1.000"/>
<text x="670.00" y="318.00" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">roll left</text>
<text x="670.00" y="331.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">take the left roll branch</text>
<rect x="746.00" y="292.00" width="252.00" height="46.00" rx="16.00" ry="16.00" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.60" opacity="1.000"/>
<text x="872.00" y="318.00" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">can roll left</text>
<text x="872.00" y="325.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">if fall is not taken, open the left</text>
<text x="872.00" y="337.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">roll branch</text>
<line x1="746.00" y1="315.00" x2="736.00" y2="315.00" stroke="#7c3aed" stroke-width="2.00" marker-end="url(#arrow)" opacity="1.000"/>
<line x1="872.00" y1="338.00" x2="872.00" y2="350.00" stroke="#7c3aed" stroke-width="2.20" marker-end="url(#arrow)" opacity="1.000"/>
<rect x="604.00" y="350.00" width="132.00" height="46.00" rx="16.00" ry="16.00" fill="#fff7ed" stroke="#d97706" stroke-width="1.60" opacity="1.000"/>
<text x="670.00" y="376.00" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">roll right</text>
<text x="670.00" y="389.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">take the right roll branch</text>
<rect x="746.00" y="350.00" width="252.00" height="46.00" rx="16.00" ry="16.00" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.60" opacity="1.000"/>
<text x="872.00" y="376.00" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">can roll right</text>
<text x="872.00" y="383.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">if left roll is not taken, open the</text>
<text x="872.00" y="395.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">right roll branch</text>
<line x1="746.00" y1="373.00" x2="736.00" y2="373.00" stroke="#7c3aed" stroke-width="2.00" marker-end="url(#arrow)" opacity="1.000"/>
<line x1="872.00" y1="396.00" x2="872.00" y2="408.00" stroke="#7c3aed" stroke-width="2.20" marker-end="url(#arrow)" opacity="1.000"/>
<rect x="620.00" y="408.00" width="380.00" height="46.00" rx="16.00" ry="16.00" fill="#fff7ed" stroke="#d97706" stroke-width="1.60" opacity="1.000"/>
<text x="810.00" y="434.00" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">noop</text>
<text x="810.00" y="447.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">fallback if no roll branch applies</text>
<line x1="810.00" y1="454.00" x2="810.00" y2="466.00" stroke="#d97706" stroke-width="2.20" marker-end="url(#arrow)" opacity="1.000"/>
<rect x="620.00" y="466.00" width="380.00" height="46.00" rx="16.00" ry="16.00" fill="#e2e8f0" stroke="#475569" stroke-width="1.60" opacity="1.000"/>
<text x="810.00" y="492.00" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">end_tick</text>
<text x="810.00" y="499.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">tick closes after the fallback</text>
<text x="810.00" y="511.00" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#475569">resolves</text>
</svg>
